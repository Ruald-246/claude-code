<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Chest Hunter - Enhanced</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
    --primary: #6366f1;
    --secondary: #8b5cf6;
    --accent: #fbbf24;
    --dark: #0f172a;
    --light: #f1f5f9;
    --glass: rgba(255, 255, 255, 0.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    padding: 20px;
    color: white;
    overflow-x: hidden;
    position: relative;
}

/* Animated Background */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
        radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(138, 92, 246, 0.3) 0%, transparent 50%);
    animation: bgShift 10s ease-in-out infinite;
    z-index: -1;
}

@keyframes bgShift {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.1); }
}

.container {
    max-width: 1400px;
    margin: 0 auto;
}

/* Header */
header {
    background: var(--glass);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    margin-bottom: 30px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    overflow: hidden;
}

header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    animation: shimmer 3s infinite;
}

@keyframes shimmer {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
    100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

header h1 {
    font-size: 3em;
    font-weight: 800;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 10px rgba(251, 191, 36, 0.5));
    animation: titlePulse 2s ease-in-out infinite;
}

@keyframes titlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
}

.stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    position: relative;
    z-index: 1;
}

.stat-item {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    padding: 15px 30px;
    border-radius: 15px;
    font-size: 1.1em;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease;
}

.stat-item:hover {
    transform: translateY(-5px);
}

.stat-label {
    font-size: 0.9em;
    opacity: 0.9;
}

.stat-value {
    font-weight: 700;
    color: var(--accent);
    font-size: 1.3em;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
}

/* Game Area */
.game-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 30px;
}

@media (max-width: 968px) {
    .game-area { grid-template-columns: 1fr; }
    header h1 { font-size: 2em; }
}

/* Chest Shop */
.chest-shop {
    background: var(--glass);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.chest-shop h2 {
    margin-bottom: 25px;
    font-size: 2em;
    font-weight: 700;
}

.chest-grid {
    display: grid;
    gap: 20px;
}

.chest-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 2px solid;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.chest-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s;
}

.chest-card:hover::before {
    left: 100%;
}

.chest-card:hover {
    transform: translateY(-10px) scale(1.02);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
}

.chest-card.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    filter: grayscale(0.8);
}

.chest-card.disabled:hover {
    transform: none;
}

.chest-icon {
    font-size: 4em;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
}

@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
}

.chest-name {
    font-size: 1.4em;
    font-weight: 700;
    margin-bottom: 8px;
}

.chest-price {
    color: var(--accent);
    font-size: 1.2em;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
}

/* Rarity Colors */
.chest-card[data-rarity="common"] { border-color: #9ca3af; }
.chest-card[data-rarity="uncommon"] { border-color: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
.chest-card[data-rarity="rare"] { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
.chest-card[data-rarity="epic"] { border-color: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.3); }
.chest-card[data-rarity="legendary"] { border-color: #f59e0b; box-shadow: 0 0 30px rgba(245, 158, 11, 0.5); animation: glow 2s ease-in-out infinite; }

@keyframes glow {
    0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    50% { box-shadow: 0 0 40px rgba(245, 158, 11, 0.8); }
}

/* Opening Area */
.opening-area {
    background: var(--glass);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    min-height: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

.chest-animation {
    font-size: 10em;
    animation: chestFloat 1s ease-in-out infinite;
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
}

@keyframes chestFloat {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-20px) rotate(5deg); }
}

.chest-animation.opening {
    animation: openChest 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
}

@keyframes openChest {
    0% { transform: scale(1) rotate(0deg); }
    25% { transform: scale(1.2) rotate(-15deg); }
    50% { transform: scale(1.3) rotate(15deg); }
    75% { transform: scale(1.2) rotate(-10deg); }
    100% { transform: scale(0) rotate(360deg); opacity: 0; }
}

.reward-display {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin-top: 30px;
}

.reward-item {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
    min-width: 160px;
    text-align: center;
    border: 2px solid;
    animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    position: relative;
    overflow: hidden;
}

.reward-item::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.5);
    transform: translate(-50%, -50%);
    animation: ripple 1s ease-out;
}

@keyframes ripple {
    to {
        width: 300px;
        height: 300px;
        opacity: 0;
    }
}

@keyframes popIn {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    50% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.reward-item .item-icon {
    font-size: 3em;
    margin-bottom: 15px;
    animation: bounce 1s ease-in-out infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.reward-item .item-name {
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 1.1em;
}

.reward-item .item-value {
    color: var(--accent);
    font-weight: 700;
    font-size: 1.2em;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
}

/* Inventory */
.inventory {
    background: var(--glass);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    margin-bottom: 30px;
}

.inventory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 15px;
}

.inventory-header h2 {
    font-size: 2em;
    font-weight: 700;
}

.inventory-controls {
    display: flex;
    gap: 15px;
}

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
}

.inventory-item {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    border: 2px solid;
    position: relative;
    transition: all 0.3s ease;
}

.inventory-item:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
}

.inventory-item .item-icon {
    font-size: 2.5em;
    margin-bottom: 15px;
}

.sell-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    border: none;
    color: white;
    padding: 8px 15px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85em;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
}

.sell-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
}

/* Rarity Colors */
.rarity-common { border-color: #9ca3af; }
.rarity-uncommon { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
.rarity-rare { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
.rarity-epic { border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
.rarity-legendary { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 0.5); animation: itemGlow 2s ease-in-out infinite; }
.rarity-mythic { border-color: #fef3c7; box-shadow: 0 0 35px rgba(254, 243, 199, 0.8); animation: mythicGlow 1.5s ease-in-out infinite; }

@keyframes itemGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.8); }
}

@keyframes mythicGlow {
    0%, 100% { box-shadow: 0 0 30px rgba(254, 243, 199, 0.8), 0 0 60px rgba(251, 191, 36, 0.5); }
    50% { box-shadow: 0 0 50px rgba(254, 243, 199, 1), 0 0 80px rgba(251, 191, 36, 0.8); }
}

/* Achievements */
.achievements {
    background: var(--glass);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
    margin-bottom: 30px;
}

.achievements h2 {
    font-size: 2em;
    font-weight: 700;
    margin-bottom: 25px;
}

.achievement-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.achievement-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    border: 2px solid rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
}

.achievement-card.unlocked {
    border-color: var(--accent);
    background: rgba(251, 191, 36, 0.2);
    box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
    animation: unlockPulse 2s ease-in-out infinite;
}

@keyframes unlockPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

.achievement-icon {
    font-size: 2.5em;
    margin-bottom: 15px;
}

.achievement-card.unlocked .achievement-icon {
    animation: spin 3s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Collection */
.collection {
    background: var(--glass);
    backdrop-filter: blur(20px);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.collection h2 {
    font-size: 2em;
    font-weight: 700;
    margin-bottom: 25px;
}

.collection-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.collection-category {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.category-name {
    font-size: 1.3em;
    margin-bottom: 15px;
    font-weight: 700;
}

.progress-bar {
    background: rgba(0, 0, 0, 0.3);
    height: 30px;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
}

.progress-fill {
    background: linear-gradient(90deg, #10b981, #34d399);
    height: 100%;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9em;
    box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
}

/* Buttons */
.btn {
    padding: 12px 25px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1em;
    font-weight: 600;
    transition: all 0.3s ease;
    font-family: 'Poppins', sans-serif;
}

.btn-secondary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
}

.btn-secondary:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
}

.btn-danger {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
}

.btn-danger:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
}

.empty-message {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    font-size: 1.2em;
    opacity: 0.7;
}

/* Particles */
.particle {
    position: fixed;
    pointer-events: none;
    animation: particleFloat 2s ease-out forwards;
}

@keyframes particleFloat {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ Mystic Chest Hunter ⚔️</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">💰 Gold</div>
                    <div class="stat-value" id="gold">100</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">📦 Chests Opened</div>
                    <div class="stat-value" id="chestsOpened">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">⭐ Total Value</div>
                    <div class="stat-value" id="totalValue">0</div>
                </div>
            </div>
        </header>

        <div class="game-area">
            <section class="chest-shop">
                <h2>🏪 Chest Shop</h2>
                <div class="chest-grid" id="chestGrid"></div>
            </section>

            <section class="opening-area" id="openingArea">
                <h2>✨ Opening Chest...</h2>
                <div class="chest-animation" id="chestAnimation"></div>
                <div class="reward-display" id="rewardDisplay"></div>
            </section>
        </div>

        <section class="inventory">
            <div class="inventory-header">
                <h2>🎒 Inventory</h2>
                <div class="inventory-controls">
                    <button class="btn btn-secondary" id="sortBtn">Sort by Value</button>
                    <button class="btn btn-danger" id="sellAllBtn">Sell All</button>
                </div>
            </div>
            <div class="inventory-grid" id="inventoryGrid">
                <p class="empty-message">Your inventory is empty. Open some chests!</p>
            </div>
        </section>

        <section class="achievements">
            <h2>🏆 Achievements</h2>
            <div class="achievement-grid" id="achievementGrid"></div>
        </section>

        <section class="collection">
            <h2>📚 Collection</h2>
            <div class="collection-stats" id="collectionStats"></div>
        </section>
    </div>

    <script>
const gameState = {
    gold: 100,
    chestsOpened: 0,
    totalValue: 0,
    inventory: [],
    achievements: [],
    collection: {
        weapons: new Set(),
        armor: new Set(),
        potions: new Set(),
        special: new Set()
    }
};

const chestTypes = [
    { name: 'Wooden Chest', rarity: 'common', cost: 10, icon: '📦', itemCount: { min: 1, max: 2 }, rarityWeights: { common: 70, uncommon: 25, rare: 4, epic: 1, legendary: 0, mythic: 0 } },
    { name: 'Bronze Chest', rarity: 'uncommon', cost: 50, icon: '🎁', itemCount: { min: 2, max: 3 }, rarityWeights: { common: 40, uncommon: 40, rare: 15, epic: 4, legendary: 1, mythic: 0 } },
    { name: 'Silver Chest', rarity: 'rare', cost: 200, icon: '💎', itemCount: { min: 3, max: 4 }, rarityWeights: { common: 20, uncommon: 35, rare: 30, epic: 12, legendary: 3, mythic: 0 } },
    { name: 'Golden Chest', rarity: 'epic', cost: 1000, icon: '👑', itemCount: { min: 4, max: 5 }, rarityWeights: { common: 5, uncommon: 20, rare: 35, epic: 30, legendary: 9, mythic: 1 } },
    { name: 'Diamond Chest', rarity: 'legendary', cost: 5000, icon: '✨', itemCount: { min: 5, max: 7 }, rarityWeights: { common: 0, uncommon: 10, rare: 25, epic: 35, legendary: 25, mythic: 5 } }
];

const itemTemplates = {
    weapons: { icon: '⚔️', names: ['Sword', 'Bow', 'Staff', 'Dagger', 'Axe', 'Hammer', 'Spear', 'Crossbow', 'Wand', 'Katana'], prefixes: ['Rusty', 'Sharp', 'Blessed', 'Cursed', 'Ancient', 'Mystic', 'Dragon', 'Phoenix', 'Shadow', 'Light'], baseValue: 20 },
    armor: { icon: '🛡️', names: ['Helmet', 'Chestplate', 'Boots', 'Gauntlets', 'Leggings', 'Shield', 'Pauldrons', 'Bracers'], prefixes: ['Leather', 'Iron', 'Steel', 'Mithril', 'Dragon', 'Divine', 'Demon', 'Crystal', 'Obsidian'], baseValue: 25 },
    potions: { icon: '🧪', names: ['Health Potion', 'Mana Potion', 'Strength Potion', 'Speed Potion', 'Defense Potion', 'Luck Potion'], prefixes: ['Minor', 'Lesser', 'Greater', 'Superior', 'Supreme', 'Ultimate'], baseValue: 15 },
    special: { icon: '🌟', names: ['Pet', 'Mount', 'Artifact', 'Relic', 'Gem', 'Crown', 'Ring', 'Amulet', 'Orb', 'Scroll'], prefixes: ['Rare', 'Exotic', 'Legendary', 'Mythical', 'Celestial', 'Infernal', 'Ethereal', 'Prismatic'], baseValue: 50 }
};

const rarityMultipliers = {
    common: { multiplier: 1, color: '#9ca3af', name: 'Common' },
    uncommon: { multiplier: 2, color: '#10b981', name: 'Uncommon' },
    rare: { multiplier: 5, color: '#3b82f6', name: 'Rare' },
    epic: { multiplier: 10, color: '#a855f7', name: 'Epic' },
    legendary: { multiplier: 25, color: '#f59e0b', name: 'Legendary' },
    mythic: { multiplier: 100, color: '#fef3c7', name: 'Mythic' }
};

const achievementsList = [
    { id: 'first_chest', name: 'First Steps', desc: 'Open your first chest', icon: '🎉', check: (state) => state.chestsOpened >= 1 },
    { id: 'chest_10', name: 'Enthusiast', desc: 'Open 10 chests', icon: '📦', check: (state) => state.chestsOpened >= 10 },
    { id: 'chest_50', name: 'Collector', desc: 'Open 50 chests', icon: '🎁', check: (state) => state.chestsOpened >= 50 },
    { id: 'chest_100', name: 'Master Hunter', desc: 'Open 100 chests', icon: '👑', check: (state) => state.chestsOpened >= 100 },
    { id: 'rich', name: 'Wealthy', desc: 'Accumulate 10,000 gold', icon: '💰', check: (state) => state.gold >= 10000 },
    { id: 'legendary_find', name: 'Legendary Find', desc: 'Find a Legendary item', icon: '⭐', check: (state) => state.inventory.some(item => item.rarity === 'legendary') },
    { id: 'mythic_find', name: 'Mythic Discovery', desc: 'Find a Mythic item', icon: '✨', check: (state) => state.inventory.some(item => item.rarity === 'mythic') },
    { id: 'full_weapon', name: 'Arsenal', desc: 'Collect 10 different weapons', icon: '⚔️', check: (state) => state.collection.weapons.size >= 10 },
    { id: 'value_100k', name: 'Fortune', desc: 'Earn 100,000 total value', icon: '💎', check: (state) => state.totalValue >= 100000 }
];

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function weightedRandom(weights) {
    const total = Object.values(weights).reduce((sum, weight) => sum + weight, 0);
    let random = Math.random() * total;
    for (const [key, weight] of Object.entries(weights)) {
        random -= weight;
        if (random <= 0) return key;
    }
    return Object.keys(weights)[0];
}

function generateItem(chestRarity) {
    const typeKeys = Object.keys(itemTemplates);
    const type = typeKeys[randomInt(0, typeKeys.length - 1)];
    const template = itemTemplates[type];
    const rarityWeights = chestTypes.find(c => c.rarity === chestRarity).rarityWeights;
    const itemRarity = weightedRandom(rarityWeights);
    const prefix = template.prefixes[randomInt(0, template.prefixes.length - 1)];
    const name = template.names[randomInt(0, template.names.length - 1)];
    const rarityInfo = rarityMultipliers[itemRarity];
    const value = Math.floor(template.baseValue * rarityInfo.multiplier * (0.8 + Math.random() * 0.4));
    return {
        id: Date.now() + Math.random(),
        type: type,
        name: `${prefix} ${name}`,
        rarity: itemRarity,
        rarityName: rarityInfo.name,
        icon: template.icon,
        value: value,
        color: rarityInfo.color
    };
}

function createParticles(x, y, count = 20) {
    const colors = ['#fbbf24', '#f59e0b', '#ef4444', '#8b5cf6', '#3b82f6'];
    for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = '✨';
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.color = colors[randomInt(0, colors.length - 1)];
        particle.style.setProperty('--tx', (randomInt(-200, 200)) + 'px');
        particle.style.setProperty('--ty', (randomInt(-200, 200)) + 'px');
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 2000);
    }
}

function openChest(chest) {
    if (gameState.gold < chest.cost) {
        alert('Not enough gold!');
        return;
    }

    createParticles(window.innerWidth / 2, window.innerHeight / 2, 30);

    gameState.gold -= chest.cost;
    gameState.chestsOpened++;
    const itemCount = randomInt(chest.itemCount.min, chest.itemCount.max);
    const items = [];
    for (let i = 0; i < itemCount; i++) {
        items.push(generateItem(chest.rarity));
    }
    items.forEach(item => {
        gameState.inventory.push(item);
        gameState.totalValue += item.value;
        gameState.collection[item.type].add(item.name);
    });
    showChestOpening(chest, items);
    updateUI();
    checkAchievements();
    saveGame();
}

function showChestOpening(chest, items) {
    const openingArea = document.getElementById('openingArea');
    const chestAnimation = document.getElementById('chestAnimation');
    const rewardDisplay = document.getElementById('rewardDisplay');
    openingArea.classList.remove('hidden');
    chestAnimation.innerHTML = chest.icon;
    chestAnimation.classList.add('opening');
    rewardDisplay.innerHTML = '';
    setTimeout(() => {
        chestAnimation.classList.remove('opening');
        items.forEach((item, index) => {
            setTimeout(() => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `reward-item rarity-${item.rarity}`;
                itemDiv.innerHTML = `
                    <div class="item-icon">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-rarity">${item.rarityName}</div>
                    <div class="item-value">${item.value} 💰</div>
                `;
                rewardDisplay.appendChild(itemDiv);
            }, index * 300);
        });
    }, 1200);
}

function sellItem(itemId) {
    const itemIndex = gameState.inventory.findIndex(item => item.id === itemId);
    if (itemIndex !== -1) {
        const item = gameState.inventory[itemIndex];
        gameState.gold += item.value;
        gameState.inventory.splice(itemIndex, 1);
        updateUI();
        saveGame();
    }
}

function sellAllItems() {
    if (gameState.inventory.length === 0) {
        alert('No items to sell!');
        return;
    }
    const totalValue = gameState.inventory.reduce((sum, item) => sum + item.value, 0);
    if (confirm(`Sell all ${gameState.inventory.length} items for ${totalValue} gold?`)) {
        gameState.gold += totalValue;
        gameState.inventory = [];
        updateUI();
        saveGame();
    }
}

function sortInventory() {
    gameState.inventory.sort((a, b) => b.value - a.value);
    updateUI();
}

function checkAchievements() {
    achievementsList.forEach(achievement => {
        if (!gameState.achievements.includes(achievement.id) && achievement.check(gameState)) {
            gameState.achievements.push(achievement.id);
        }
    });
    updateAchievements();
}

function updateUI() {
    document.getElementById('gold').textContent = gameState.gold.toLocaleString();
    document.getElementById('chestsOpened').textContent = gameState.chestsOpened.toLocaleString();
    document.getElementById('totalValue').textContent = gameState.totalValue.toLocaleString();
    updateChestShop();
    updateInventory();
    updateCollection();
}

function updateChestShop() {
    const chestGrid = document.getElementById('chestGrid');
    chestGrid.innerHTML = '';
    chestTypes.forEach(chest => {
        const canAfford = gameState.gold >= chest.cost;
        const chestDiv = document.createElement('div');
        chestDiv.className = `chest-card ${canAfford ? '' : 'disabled'}`;
        chestDiv.setAttribute('data-rarity', chest.rarity);
        chestDiv.innerHTML = `
            <div class="chest-info">
                <div class="chest-name">${chest.name}</div>
                <div class="chest-price">💰 ${chest.cost} gold</div>
                <div class="chest-chance">${chest.itemCount.min}-${chest.itemCount.max} items</div>
            </div>
            <div class="chest-icon">${chest.icon}</div>
        `;
        if (canAfford) {
            chestDiv.addEventListener('click', () => openChest(chest));
        }
        chestGrid.appendChild(chestDiv);
    });
}

function updateInventory() {
    const inventoryGrid = document.getElementById('inventoryGrid');
    inventoryGrid.innerHTML = '';
    if (gameState.inventory.length === 0) {
        inventoryGrid.innerHTML = '<p class="empty-message">Your inventory is empty. Open some chests!</p>';
        return;
    }
    gameState.inventory.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = `inventory-item rarity-${item.rarity}`;
        itemDiv.innerHTML = `
            <button class="sell-btn" onclick="sellItem(${item.id})">Sell</button>
            <div class="item-icon">${item.icon}</div>
            <div class="item-name">${item.name}</div>
            <div class="item-type">${item.type}</div>
            <div class="item-rarity">${item.rarityName}</div>
            <div class="item-value">${item.value} 💰</div>
        `;
        inventoryGrid.appendChild(itemDiv);
    });
}

function updateAchievements() {
    const achievementGrid = document.getElementById('achievementGrid');
    achievementGrid.innerHTML = '';
    achievementsList.forEach(achievement => {
        const unlocked = gameState.achievements.includes(achievement.id);
        const achDiv = document.createElement('div');
        achDiv.className = `achievement-card ${unlocked ? 'unlocked' : ''}`;
        achDiv.innerHTML = `
            <div class="achievement-icon">${achievement.icon}</div>
            <div class="achievement-name">${achievement.name}</div>
            <div class="achievement-desc">${achievement.desc}</div>
        `;
        achievementGrid.appendChild(achDiv);
    });
}

function updateCollection() {
    const collectionStats = document.getElementById('collectionStats');
    collectionStats.innerHTML = '';
    const categories = [
        { key: 'weapons', name: 'Weapons', icon: '⚔️', total: itemTemplates.weapons.names.length * itemTemplates.weapons.prefixes.length },
        { key: 'armor', name: 'Armor', icon: '🛡️', total: itemTemplates.armor.names.length * itemTemplates.armor.prefixes.length },
        { key: 'potions', name: 'Potions', icon: '🧪', total: itemTemplates.potions.names.length * itemTemplates.potions.prefixes.length },
        { key: 'special', name: 'Special', icon: '🌟', total: itemTemplates.special.names.length * itemTemplates.special.prefixes.length }
    ];
    categories.forEach(category => {
        const collected = gameState.collection[category.key].size;
        const percentage = Math.floor((collected / category.total) * 100);
        const catDiv = document.createElement('div');
        catDiv.className = 'collection-category';
        catDiv.innerHTML = `
            <div class="category-name">${category.icon} ${category.name}</div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: ${percentage}%">
                    ${collected}/${category.total}
                </div>
            </div>
        `;
        collectionStats.appendChild(catDiv);
    });
}

function saveGame() {
    const saveData = {
        ...gameState,
        collection: {
            weapons: Array.from(gameState.collection.weapons),
            armor: Array.from(gameState.collection.armor),
            potions: Array.from(gameState.collection.potions),
            special: Array.from(gameState.collection.special)
        }
    };
    localStorage.setItem('mysticChestHunter', JSON.stringify(saveData));
}

function loadGame() {
    const saveData = localStorage.getItem('mysticChestHunter');
    if (saveData) {
        const data = JSON.parse(saveData);
        gameState.gold = data.gold;
        gameState.chestsOpened = data.chestsOpened;
        gameState.totalValue = data.totalValue;
        gameState.inventory = data.inventory;
        gameState.achievements = data.achievements;
        gameState.collection = {
            weapons: new Set(data.collection.weapons),
            armor: new Set(data.collection.armor),
            potions: new Set(data.collection.potions),
            special: new Set(data.collection.special)
        };
    }
}

document.getElementById('sortBtn').addEventListener('click', sortInventory);
document.getElementById('sellAllBtn').addEventListener('click', sellAllItems);
window.sellItem = sellItem;

loadGame();
updateUI();
updateAchievements();
    </script>
</body>
</html>
