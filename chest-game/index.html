<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystic Chest Hunter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>⚔️ Mystic Chest Hunter ⚔️</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">💰 Gold:</span>
                    <span class="stat-value" id="gold">100</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">📦 Chests Opened:</span>
                    <span class="stat-value" id="chestsOpened">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⭐ Total Value:</span>
                    <span class="stat-value" id="totalValue">0</span>
                </div>
            </div>
        </header>

        <!-- Main Game Area -->
        <div class="game-area">
            <!-- Chest Shop -->
            <section class="chest-shop">
                <h2>🏪 Chest Shop</h2>
                <div class="chest-grid" id="chestGrid">
                    <!-- Chests will be generated by JavaScript -->
                </div>
            </section>

            <!-- Opening Animation Area -->
            <section class="opening-area" id="openingArea">
                <h2>✨ Opening Chest...</h2>
                <div class="chest-animation" id="chestAnimation"></div>
                <div class="reward-display" id="rewardDisplay"></div>
            </section>
        </div>

        <!-- Inventory Section -->
        <section class="inventory">
            <div class="inventory-header">
                <h2>🎒 Inventory</h2>
                <div class="inventory-controls">
                    <button class="btn btn-secondary" id="sortBtn">Sort by Value</button>
                    <button class="btn btn-danger" id="sellAllBtn">Sell All</button>
                </div>
            </div>
            <div class="inventory-grid" id="inventoryGrid">
                <p class="empty-message">Your inventory is empty. Open some chests!</p>
            </div>
        </section>

        <!-- Achievements Panel -->
        <section class="achievements">
            <h2>🏆 Achievements</h2>
            <div class="achievement-grid" id="achievementGrid">
                <!-- Achievements will be generated by JavaScript -->
            </div>
        </section>

        <!-- Collection Tracker -->
        <section class="collection">
            <h2>📚 Collection</h2>
            <div class="collection-stats" id="collectionStats">
                <!-- Collection progress will be shown here -->
            </div>
        </section>
    </div>

    <script src="game.js"></script>
</body>
</html>
